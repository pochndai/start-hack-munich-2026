<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearing the universe, faster</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100vw; height: auto; display: block; background: #04060b; }
  @media (min-aspect-ratio: 16/9) { canvas { width: auto; height: 100vh; } }
</style></head><body>
<canvas id="stage" width="1920" height="1080" role="img" aria-label="An animated story in four scenes: two neutron stars collide, the ripples reach a detector on Earth, the detector design with its beams of light, and the live search for better settings."></canvas>
<script>
"use strict";
// Everything is drawn on one 1920x1080 canvas, text included, so that a recording of the canvas is the whole film.
const stage = document.getElementById("stage"), g = stage.getContext("2d"), W = 1920, H = 1080;
const T = { source: 0, arrival: 12, design: 25, search: 36, end: 60 };
const INK = "#f3efe6", SOFT = "rgba(243,239,230,0.62)", LASER = [255, 86, 48], CORE = [255, 205, 170], RIPPLE = [130, 180, 255], OURS = [96, 226, 160], THEIRS = [236, 122, 104];
const SANS = '"Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif', MONO = '"SF Mono", Menlo, Consolas, monospace';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const span = (t, a, b) => smooth((t - a) / (b - a));                              // 0 before a, 1 after b
const window_ = (t, a, b, edge = 0.6) => Math.min(span(t, a, a + edge), 1 - span(t, b - edge, b));  // fade in at a, out at b
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function random(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let k = Math.imul(seed ^ seed >>> 15, 1 | seed); k = k + Math.imul(k ^ k >>> 7, 61 | k) ^ k; return ((k ^ k >>> 14) >>> 0) / 4294967296; }; }

let SCENE = null, time = 0, playing = false, hold = false, lastFrame = 0;
const live = { stream: null, steps: 0, seconds: 0, best: [], shown: null, target: null, loss: null, started: false };

// ---------------------------------------------------------------- the sky
const sky = document.createElement("canvas"); sky.width = W * 2; sky.height = H;
const bright = [];
(function paintSky() {
  const s = sky.getContext("2d"), r = random(7);
  s.fillStyle = "#04060b"; s.fillRect(0, 0, sky.width, H);
  for (let i = 0; i < 260; i++) {                      // a faint band of dust and far stars across the sky
    const x = r() * sky.width, y = H * 0.55 + (x / sky.width - 0.5) * -420 + (r() - 0.5) * 300 * (0.4 + r()), size = 90 + r() * 260;
    const glow = s.createRadialGradient(x, y, 0, x, y, size), tint = r() < 0.5 ? [70, 96, 170] : [120, 84, 150];
    glow.addColorStop(0, rgba(tint, 0.05 * r())); glow.addColorStop(1, rgba(tint, 0));
    s.fillStyle = glow; s.fillRect(x - size, y - size, size * 2, size * 2);
  }
  for (let i = 0; i < 5200; i++) {
    const x = r() * sky.width, y = r() * H, m = Math.pow(r(), 5.5), size = 0.35 + m * 1.9, warm = r();
    const tint = warm < 0.2 ? [255, 214, 180] : warm < 0.5 ? [200, 220, 255] : [240, 242, 255];
    s.fillStyle = rgba(tint, 0.25 + 0.75 * Math.pow(r(), 2)); s.beginPath(); s.arc(x, y, size, 0, 6.2832); s.fill();
    if (m > 0.7 && bright.length < 20) bright.push({ x, y, size: size + 0.6, tint, phase: r() * 6.28, rate: 0.7 + r() * 1.6 });
  }
})();
function drawSky(drift, alpha = 1) {
  g.globalAlpha = alpha;
  const x = ((drift % sky.width) + sky.width) % sky.width;
  g.drawImage(sky, -x, 0); g.drawImage(sky, sky.width - x, 0);
  g.globalCompositeOperation = "lighter";
  for (const star of bright) {                         // the brightest stars twinkle and carry a faint cross
    const sx = ((star.x - x) % sky.width + sky.width) % sky.width; if (sx > W + 40) continue;
    const k = 0.55 + 0.45 * Math.sin(time * star.rate + star.phase), reach = star.size * (4.5 + 3 * k);
    const halo = g.createRadialGradient(sx, star.y, 0, sx, star.y, reach); halo.addColorStop(0, rgba(star.tint, 0.42 * k * alpha)); halo.addColorStop(1, rgba(star.tint, 0));
    g.fillStyle = halo; g.fillRect(sx - reach, star.y - reach, reach * 2, reach * 2);
    g.strokeStyle = rgba(star.tint, 0.3 * k * alpha); g.lineWidth = 1; g.beginPath(); g.moveTo(sx - reach * 2.4, star.y); g.lineTo(sx + reach * 2.4, star.y); g.moveTo(sx, star.y - reach * 2.4); g.lineTo(sx, star.y + reach * 2.4); g.stroke();
  }
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
}

// ---------------------------------------------------------------- words
function words(text, x, y, size, width, alpha, weight = 500, color = INK, lineGap = 1.28, align = "left") {
  if (alpha <= 0.01) return 0;
  g.font = `${weight} ${size}px ${SANS}`; g.textAlign = align; g.textBaseline = "alphabetic";
  const lines = []; let line = "";
  for (const word of text.split(" ")) { const next = line ? line + " " + word : word; if (g.measureText(next).width > width && line) { lines.push(line); line = word; } else line = next; }
  lines.push(line);
  g.save(); g.globalAlpha = alpha; g.shadowColor = "rgba(0,0,0,0.85)"; g.shadowBlur = 18; g.fillStyle = color;
  lines.forEach((part, i) => g.fillText(part, x, y + i * size * lineGap)); g.restore();
  return lines.length;
}
const CAPTIONS = [
  [0.9, 7.6, "A hundred million years ago, two dead stars spiralled into each other."],
  [8.5, 11.8, "The collision sent ripples through space itself."],
  [12.4, 16.3, "The ripples are still travelling. Some of them reach Earth."],
  [16.9, 20.6, "A detector: laser light racing down two long arms and back."],
  [20.9, 24.7, "A ripple stretches one arm and squeezes the other. The light flickers. That flicker is the signal."],
  [25.5, 30.2, "To hear fainter collisions, physicists design new detectors."],
  [30.5, 35.7, () => `This one has ${SCENE ? SCENE.variables : 193} knobs. Every beam you see is computed by the simulator.`],
  [36.5, 43.6, "Finding good settings means simulating it again and again. Here it runs live."],
  [44.0, 54.6, () => SCENE && SCENE.original ? `The original code needs ${SCENE.original.toFixed(0)} seconds for every step. Ours does ${rate()} steps a second.` : `Ours does ${rate()} design steps a second.`],
];
const rate = () => live.seconds > 0.4 ? Math.round(live.steps / live.seconds) : 19;
function captions(t) {
  for (const [a, b, text] of CAPTIONS) words(typeof text === "function" ? text() : text, 96, 968, 46, 1500, window_(t, a, b, 0.55), 500);
}

// ---------------------------------------------------------------- scene 1: the collision
const MERGE = 8.3, RATE = 120, orbit = { angle: [], gap: [], height: [] };
(function integrate() {
  let angle = 0;
  for (let i = 0; i <= 16 * RATE; i++) {
    const t = i / RATE, left = Math.max(1 - t / MERGE, 0);
    const gap = t < MERGE ? 2.5 * Math.pow(left, 0.27) : 0, spin = t < MERGE ? Math.min(1.5 * Math.pow(Math.max(left, 0.004), -0.62), 7.5) : 7.5;
    angle += spin / RATE;
    orbit.angle.push(angle); orbit.gap.push(gap);
    orbit.height.push(t < MERGE ? 0.3 + 0.75 * Math.pow(spin / 7.5, 0.8) : 1.05 * Math.exp(-(t - MERGE) / 0.8));
  }
})();
const at = (list, t) => list[clamp(Math.round(t * RATE), 0, list.length - 1)];
const CAMERA = { back: 12, height: 3.3, focal: 900, horizon: 318 };
function ripple(u, v, t) {                               // height of the fabric of space at (u, v): a two-armed spiral moving outwards
  const r = Math.hypot(u, v), then = t - r / 3.4;
  if (then <= 0) return 0;
  const lift = at(orbit.height, then) * Math.cos(2 * (Math.atan2(v, u) - at(orbit.angle, then))) / (1 + r * 0.16);
  return lift * smooth(r / 2.6) * smooth(then / 0.6);
}
function project(u, v, z) { const d = v + CAMERA.back; return [W / 2 + u / d * CAMERA.focal, CAMERA.horizon + (CAMERA.height - z) / d * CAMERA.focal, d]; }
function drawFabric(t, alpha) {
  const floor = g.createLinearGradient(0, CAMERA.horizon - 30, 0, H); floor.addColorStop(0, "rgba(4,6,11,0)"); floor.addColorStop(0.22, `rgba(4,6,12,${0.86 * alpha})`); floor.addColorStop(1, `rgba(5,8,16,${0.94 * alpha})`);
  g.fillStyle = floor; g.fillRect(0, CAMERA.horizon - 30, W, H);
  g.lineWidth = 1.3; g.lineCap = "round"; g.lineJoin = "round";
  for (let v = -8.4; v <= 21; v += 0.7) {                // lines across: one depth each, so one opacity each
    const fade = Math.pow(clamp(1 - (v + 8.4) / 30), 1.5) * alpha;
    g.strokeStyle = rgba(RIPPLE, 0.07 + 0.62 * fade); g.beginPath();
    for (let i = 0; i <= 304; i++) { const u = -19 + i * 0.125, p = project(u, v, ripple(u, v, t)); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
    g.stroke();
  }
  for (let u = -18.9; u <= 19; u += 0.7) {               // lines into the distance fade with a gradient
    const near = project(u, -8.4, 0), far = project(u, 21, 0), paint = g.createLinearGradient(0, near[1], 0, far[1]);
    paint.addColorStop(0, rgba(RIPPLE, 0.6 * alpha)); paint.addColorStop(1, rgba(RIPPLE, 0.04 * alpha));
    g.strokeStyle = paint; g.beginPath();
    for (let i = 0; i <= 294; i++) { const v = -8.4 + i * 0.1, p = project(u, v, ripple(u, v, t)); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
    g.stroke();
  }
}
function glow(x, y, radius, color, alpha) {
  const paint = g.createRadialGradient(x, y, 0, x, y, radius);
  paint.addColorStop(0, rgba(color, alpha)); paint.addColorStop(0.25, rgba(color, alpha * 0.45)); paint.addColorStop(1, rgba(color, 0));
  g.fillStyle = paint; g.fillRect(x - radius, y - radius, radius * 2, radius * 2);
}
function drawStars(t, alpha) {
  g.globalCompositeOperation = "lighter";
  const lift = 1.25;
  if (t < MERGE) {
    for (const side of [0, Math.PI]) {
      for (let k = 46; k >= 0; k--) {                    // a fading trail behind each star
        const then = t - k * 0.012; if (then < 0) continue;
        const a = at(orbit.angle, then) + side, gap = at(orbit.gap, then), p = project(gap * Math.cos(a), gap * Math.sin(a), lift);
        glow(p[0], p[1], 15 * 12 / p[2], [150, 190, 255], 0.05 * (1 - k / 46) * alpha);
      }
      const a = at(orbit.angle, t) + side, gap = at(orbit.gap, t), p = project(gap * Math.cos(a), gap * Math.sin(a), lift), scale = 12 / p[2];
      glow(p[0], p[1], 120 * scale, [120, 170, 255], 0.5 * alpha); glow(p[0], p[1], 34 * scale, [235, 244, 255], alpha);
      g.fillStyle = rgba([255, 255, 255], alpha); g.beginPath(); g.arc(p[0], p[1], 7 * scale, 0, 6.2832); g.fill();
    }
  }
  const p = project(0, 0, lift), since = t - MERGE;
  if (since > 0) {                                       // the collision: a flash, a streak of light, then a fading ember
    const flash = Math.exp(-since / 0.42), ember = Math.exp(-since / 2.6);
    glow(p[0], p[1], 150 + 1250 * (1 - flash), [255, 244, 225], 0.85 * flash * alpha);
    glow(p[0], p[1], 240, [255, 190, 120], 0.8 * ember * alpha); glow(p[0], p[1], 46, [255, 255, 255], ember * alpha);
    g.fillStyle = rgba([255, 240, 215], 0.75 * flash * alpha);
    g.beginPath(); g.ellipse(p[0], p[1], 880 * Math.min(1, since * 4 + 0.1), 5 + 11 * flash, 0, 0, 6.2832); g.fill();
  }
  g.globalCompositeOperation = "source-over";
}

// ---------------------------------------------------------------- scene 2: Earth and the detector
const land = []; { const r = random(21);
  for (let c = 0; c < 9; c++) { let u = r() * 4 - 2, v = r() * 1.3 - 0.65; for (let i = 0; i < 26; i++) { u += (r() - 0.5) * 0.16; v += (r() - 0.5) * 0.13; land.push([u, v, 0.035 + r() * 0.085, 0.03 + r() * 0.07, r() * 3.14, r() < 0.3 ? 1 : 0]); } }
  for (let i = 0; i < 46; i++) land.push([r() * 4 - 2, r() * 1.7 - 0.85, 0.12 + r() * 0.3, 0.012 + r() * 0.03, (r() - 0.5) * 0.5, 2]); }
function drawEarth(x, y, R, alpha) {
  if (alpha <= 0.01) return;
  g.save(); g.globalAlpha = alpha;
  g.globalCompositeOperation = "lighter"; glow(x, y, R * 1.34, [80, 150, 255], 0.5); g.globalCompositeOperation = "source-over";
  g.beginPath(); g.arc(x, y, R, 0, 6.2832); g.clip();
  const sea = g.createRadialGradient(x - R * 0.42, y - R * 0.38, R * 0.05, x, y, R * 1.05);
  sea.addColorStop(0, "#3f86d6"); sea.addColorStop(0.5, "#15407e"); sea.addColorStop(1, "#061a3a");
  g.fillStyle = sea; g.fillRect(x - R, y - R, R * 2, R * 2);
  const turn = time * 0.012;
  for (const [u, v, a, b, tilt, kind] of land) {         // soft patches of land and cloud drifting with the rotation
    const lx = ((u + turn + 2) % 4 + 4) % 4 - 2;
    g.fillStyle = kind === 2 ? "rgba(240,246,255,0.2)" : kind === 1 ? "rgba(150,138,96,0.5)" : "rgba(62,120,82,0.55)";
    g.beginPath(); g.ellipse(x + lx * R * 0.7, y + v * R, a * R, b * R, tilt, 0, 6.2832); g.fill();
  }
  const night = g.createLinearGradient(x - R * 0.2, y - R * 0.3, x + R * 0.95, y + R * 0.8);
  night.addColorStop(0, "rgba(2,4,12,0)"); night.addColorStop(0.55, "rgba(2,4,12,0.62)"); night.addColorStop(1, "rgba(2,4,12,0.96)");
  g.fillStyle = night; g.fillRect(x - R, y - R, R * 2, R * 2);
  const rim = g.createRadialGradient(x, y, R * 0.86, x, y, R); rim.addColorStop(0, "rgba(120,190,255,0)"); rim.addColorStop(1, "rgba(120,190,255,0.5)");
  g.fillStyle = rim; g.fillRect(x - R, y - R, R * 2, R * 2);
  g.restore();
}
function beam(x1, y1, x2, y2, strength, scale = 1, alpha = 1) {   // a beam of laser light: wide soft halo, glow, hot core
  if (strength <= 0.004 || alpha <= 0.01) return;
  g.lineCap = "round";
  for (const [width, color, a] of [[(9 + 22 * strength) * scale, LASER, 0.07 + 0.16 * strength], [(3 + 6 * strength) * scale, LASER, 0.18 + 0.5 * strength], [(1 + 2.2 * strength) * scale, CORE, 0.25 + 0.75 * strength]]) {
    g.strokeStyle = rgba(color, a * alpha); g.lineWidth = width; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }
}
const chirp = t => {                                     // the stretch of the arms while the ripple passes: slow, then faster and stronger, then gone
  const k = clamp((t - 19.4) / 4.4), size = t < 23.8 ? 0.012 + 0.05 * Math.pow(k, 2.2) : 0.062 * Math.exp(-(t - 23.8) / 0.25);
  return size * smooth((t - 19.4) / 0.8) * Math.sin(6.2832 * (0.55 * (t - 19.4) + 0.36 * Math.pow(Math.max(t - 19.4, 0), 2.1)));
};
function drawDetector(t, alpha) {
  if (alpha <= 0.01) return;
  g.save(); g.globalAlpha = alpha;
  const ground = g.createRadialGradient(820, 520, 80, 820, 520, 1250); ground.addColorStop(0, "rgba(22,40,46,0.96)"); ground.addColorStop(1, "rgba(5,9,14,0.98)");
  g.fillStyle = ground; g.fillRect(0, 0, W, H);
  g.strokeStyle = "rgba(160,200,200,0.05)"; g.lineWidth = 1;                // faint survey lines on the ground
  for (let i = -6; i < 30; i++) { g.beginPath(); g.moveTo(i * 110, 0); g.lineTo(i * 110 + 600, H); g.stroke(); }
  const stretch = chirp(t), cx = 560, cy = 610, across = 900 * (1 + stretch), up = 470 * (1 - stretch * 1.7);
  const strength = clamp(Math.abs(stretch) / 0.05), bands = clamp(span(t, 19.2, 20.4) - span(t, 23.9, 24.8));
  g.save(); g.translate(cx + 300, cy - 200); g.rotate(-0.62);               // the ripple itself, passing over the site
  for (let k = -9; k <= 9; k++) {
    const x = k * 250 + ((t * 330) % 250), band = g.createLinearGradient(x - 90, 0, x + 90, 0);
    band.addColorStop(0, rgba(RIPPLE, 0)); band.addColorStop(0.5, rgba(RIPPLE, 0.1 * bands)); band.addColorStop(1, rgba(RIPPLE, 0));
    g.fillStyle = band; g.fillRect(x - 90, -1500, 180, 3000);
  }
  g.restore();
  g.strokeStyle = "rgba(205,220,235,0.34)"; g.lineWidth = 2;                // the vacuum tubes and the buildings
  for (const d of [-11, 11]) { g.beginPath(); g.moveTo(cx, cy + d); g.lineTo(cx + across, cy + d); g.moveTo(cx + d, cy); g.lineTo(cx + d, cy - up); g.stroke(); }
  g.fillStyle = "rgba(14,22,28,0.95)"; g.strokeStyle = "rgba(205,220,235,0.5)";
  for (const [x, y, w, h] of [[cx - 58, cy - 58, 116, 116], [cx + across - 26, cy - 34, 74, 68], [cx - 34, cy - up - 48, 68, 74], [cx - 330, cy - 30, 96, 60], [cx - 36, cy + 150, 72, 62]]) { g.beginPath(); g.roundRect(x, y, w, h, 8); g.fill(); g.stroke(); }
  g.globalCompositeOperation = "lighter";
  const on = span(t, 16.9, 18.3);
  beam(cx - 234, cy, cx, cy, 0.95 * on); beam(cx, cy, cx + across + 8, cy, 0.9 * on); beam(cx, cy, cx, cy - up - 8, 0.9 * on);
  beam(cx, cy, cx, cy + 172, (0.05 + 0.95 * strength) * on);
  glow(cx - 262, cy, 60, LASER, 0.8 * on); glow(cx, cy, 70, CORE, 0.5 * on);
  glow(cx, cy + 182, 30 + 90 * strength, [255, 236, 190], (0.2 + 0.8 * strength) * on);
  g.globalCompositeOperation = "source-over";
  g.strokeStyle = "rgba(236,242,250,0.95)"; g.lineWidth = 6; g.lineCap = "round";   // mirrors at the ends, the splitter in the corner
  g.beginPath(); g.moveTo(cx + across + 12, cy - 22); g.lineTo(cx + across + 12, cy + 22); g.moveTo(cx - 22, cy - up - 12); g.lineTo(cx + 22, cy - up - 12); g.stroke();
  g.lineWidth = 3; g.beginPath(); g.moveTo(cx - 20, cy + 20); g.lineTo(cx + 20, cy - 20); g.stroke();
  const label = (text, x, y, a, align = "left") => words(text, x, y, 25, 600, a * alpha, 500, SOFT, 1.25, align);
  label("laser", cx - 282, cy - 46, on, "center"); label("mirror", cx + across + 12, cy - 56, on, "center"); label("mirror", cx + 60, cy - up - 4, on);
  label("light detector", cx + 56, cy + 192, on);
  label("each arm: 4 kilometres", cx + across / 2, cy + 52, span(t, 17.6, 18.6), "center");
  const trace = span(t, 20.6, 21.2);                                         // the signal, drawn as it arrives
  if (trace > 0.01) {
    const x0 = 1000, x1 = 1800, y0 = 290;
    g.globalAlpha = alpha * trace; g.strokeStyle = "rgba(243,239,230,0.16)"; g.lineWidth = 1; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y0); g.stroke();
    g.strokeStyle = rgba([255, 236, 190], 0.95); g.lineWidth = 3; g.lineJoin = "round"; g.beginPath();
    for (let s = 19.4; s <= Math.min(t, 24.9); s += 0.008) { const x = x0 + (s - 19.4) / 5.5 * (x1 - x0), y = y0 - chirp(s) * 1900; s === 19.4 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke(); g.globalAlpha = alpha;
    label("the signal, as the light detector sees it", x0, y0 - 150, trace);
    words("the stretch is drawn fifty billion billion times too large", x1, y0 + 168, 21, 900, trace * alpha * 0.9, 400, "rgba(243,239,230,0.45)", 1.2, "right");
  }
  g.restore();
}

// ---------------------------------------------------------------- scenes 3 and 4: the design and the search
const frame = t => { const k = span(t, T.search - 0.3, T.search + 1.3); return { x: lerp(606, 96, k), y: lerp(60, 104, k), unit: lerp(177, 158, k) }; };
const strengthOf = power => clamp((power + 3) / 9.5);                        // from one thousandth of a watt to three million watts
function drawDesign(t, alpha) {
  if (!SCENE || alpha <= 0.01) return;
  const f = frame(t), u = f.unit / 177, at_ = name => { const n = SCENE.nodes[name]; return [f.x + n.x * f.unit, f.y + n.y * f.unit]; };
  const middle = (SCENE.size + 1) / 2, arrive = name => { const n = SCENE.nodes[name]; return span(t, T.design + 0.5 + Math.hypot(n.x - middle, n.y - middle) * 0.75, T.design + 1.3 + Math.hypot(n.x - middle, n.y - middle) * 0.75); };
  const powers = t >= T.search && live.shown ? live.shown : SCENE.published_light;
  g.save(); g.globalCompositeOperation = "lighter";
  SCENE.beams.forEach((b, i) => { const p = at_(b.a), q = at_(b.b); beam(p[0], p[1], q[0], q[1], strengthOf(powers[i]), u, alpha * Math.min(arrive(b.a), arrive(b.b)) * span(t, T.design + 1.6, T.design + 3.4)); });
  g.restore();
  for (const [name, n] of Object.entries(SCENE.nodes)) {
    const [x, y] = at_(name), a = alpha * arrive(name); if (a <= 0.01) continue;
    g.save(); g.globalAlpha = a; g.translate(x, y); g.lineCap = "round";

// ---------------------------------------------------------------- the live search
function startSearch() {
  if (live.started || !SCENE) return;
  Object.assign(live, { started: true, steps: 0, seconds: 0, best: [], shown: null, target: null, radius: 0, theirs: 0 });
  sources.forEach(source => source.reached = 0);
  live.stream = new EventSource("/run?seed=2");
  live.stream.onmessage = message => {
    const step = JSON.parse(message.data);
    live.steps = step.step + 1; live.seconds = step.seconds; live.target = step.light;
    live.best.push(Math.min(step.loss, live.best.length ? live.best[live.best.length - 1] : Infinity));
  };
  live.stream.onerror = stopSearch;
}
function stopSearch() { if (live.stream) live.stream.close(); live.stream = null; }
