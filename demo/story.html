<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearing the universe, faster</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100vw; height: auto; display: block; background: #04060b; cursor: pointer; }
  @media (min-aspect-ratio: 16/9) { canvas { width: auto; height: 100vh; } }
</style></head><body>
<canvas id="stage" width="1920" height="1080" role="img" aria-label="A demo in eight steps, advanced with the space bar: two stars crash and send ripples through space, a machine on Earth feels them with laser light, a bigger machine with 193 settings, and the live search for good settings by our code and by the original code."></canvas>
<script>
"use strict";
// One 1920x1080 canvas, text included, so a recording of the canvas is the whole demo.
// The presenter drives it: every press of the space bar goes one step further, and each step keeps moving until the next press.
const stage = document.getElementById("stage"), g = stage.getContext("2d"), W = 1920, H = 1080;
const INK = "#f3efe6", SOFT = "rgba(243,239,230,0.62)", LASER = [255, 86, 48], CORE = [255, 205, 170], RIPPLE = [130, 180, 255], OURS = [96, 226, 160], THEIRS = [236, 122, 104];
const SANS = '"Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif', MONO = '"SF Mono", Menlo, Consolas, monospace';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const span = (t, a, b) => smooth((t - a) / (b - a));                              // 0 before a, 1 after b
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function random(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let k = Math.imul(seed ^ seed >>> 15, 1 | seed); k = k + Math.imul(k ^ k >>> 7, 61 | k) ^ k; return ((k ^ k >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- the steps
const STEPS = ["title", "crash", "machine", "ripple", "design", "search", "compare", "end"];
const PART = { title: "sky", crash: "crash", machine: "machine", ripple: "machine", design: "design", search: "design", compare: "design", end: "design" };
const AUTO = [2, 14, 8, 10, 9, 11, 10, 7];                                       // seconds per step when recording
let SCENE = null, time = 0, lastFrame = 0, step = 0, previous = 0, changed = -10;
const entered = STEPS.map(() => -100), at_ = name => STEPS.indexOf(name), since = name => time - entered[at_(name)];
const live = { stream: null, steps: 0, seconds: 0, best: [], shown: null, target: null, started: false, radius: 0, theirs: 0 };
function go(to) {
  to = clamp(to, 0, STEPS.length - 1); if (to === step) return;
  previous = step; step = to; changed = time; entered[to] = time;
  if (to >= at_("search")) startSearch(); else { stopSearch(); live.started = false; }
}
function shows(part) {                                                            // how visible a part of the demo is right now, with a soft change between parts
  const now = PART[STEPS[step]], before = PART[STEPS[previous]], k = span(time - changed, 0, 0.9);
  return now === before ? +(now === part) : now === part ? k : before === part ? 1 - k : 0;
}

// ---------------------------------------------------------------- the sky
const sky = document.createElement("canvas"); sky.width = W * 2; sky.height = H;
const bright = [];
(function paintSky() {
  const s = sky.getContext("2d"), r = random(7);
  s.fillStyle = "#04060b"; s.fillRect(0, 0, sky.width, H);
  for (let i = 0; i < 260; i++) {                      // a faint band of dust and far stars across the sky
    const x = r() * sky.width, y = H * 0.55 + (x / sky.width - 0.5) * -420 + (r() - 0.5) * 300 * (0.4 + r()), size = 90 + r() * 260;
    const glow_ = s.createRadialGradient(x, y, 0, x, y, size), tint = r() < 0.5 ? [70, 96, 170] : [120, 84, 150];
    glow_.addColorStop(0, rgba(tint, 0.05 * r())); glow_.addColorStop(1, rgba(tint, 0));
    s.fillStyle = glow_; s.fillRect(x - size, y - size, size * 2, size * 2);
  }
  for (let i = 0; i < 5200; i++) {
    const x = r() * sky.width, y = r() * H, m = Math.pow(r(), 5.5), size = 0.35 + m * 1.9, warm = r();
    const tint = warm < 0.2 ? [255, 214, 180] : warm < 0.5 ? [200, 220, 255] : [240, 242, 255];
    s.fillStyle = rgba(tint, 0.25 + 0.75 * Math.pow(r(), 2)); s.beginPath(); s.arc(x, y, size, 0, 6.2832); s.fill();
    if (m > 0.7 && bright.length < 20) bright.push({ x, y, size: size + 0.6, tint, phase: r() * 6.28, rate: 0.7 + r() * 1.6 });
  }
})();
function drawSky(drift) {
  const x = ((drift % sky.width) + sky.width) % sky.width;
  g.drawImage(sky, -x, 0); g.drawImage(sky, sky.width - x, 0);
  g.globalCompositeOperation = "lighter";
  for (const star of bright) {                         // the brightest stars twinkle and carry a faint cross
    const sx = ((star.x - x) % sky.width + sky.width) % sky.width; if (sx > W + 40) continue;
    const k = 0.55 + 0.45 * Math.sin(time * star.rate + star.phase), reach = star.size * (4.5 + 3 * k);
    const halo = g.createRadialGradient(sx, star.y, 0, sx, star.y, reach); halo.addColorStop(0, rgba(star.tint, 0.42 * k)); halo.addColorStop(1, rgba(star.tint, 0));
    g.fillStyle = halo; g.fillRect(sx - reach, star.y - reach, reach * 2, reach * 2);
    g.strokeStyle = rgba(star.tint, 0.3 * k); g.lineWidth = 1; g.beginPath(); g.moveTo(sx - reach * 2.4, star.y); g.lineTo(sx + reach * 2.4, star.y); g.moveTo(sx, star.y - reach * 2.4); g.lineTo(sx, star.y + reach * 2.4); g.stroke();
  }
  g.globalCompositeOperation = "source-over";
}

// ---------------------------------------------------------------- words
function words(text, x, y, size, width, alpha, weight = 500, color = INK, lineGap = 1.28, align = "left") {
  if (alpha <= 0.01) return 0;
  g.font = `${weight} ${size}px ${SANS}`; g.textAlign = align; g.textBaseline = "alphabetic";
  const lines = []; let line = "";
  for (const word of text.split(" ")) { const next = line ? line + " " + word : word; if (g.measureText(next).width > width && line) { lines.push(line); line = word; } else line = next; }
  lines.push(line);
  g.save(); g.globalAlpha = alpha; g.shadowColor = "rgba(0,0,0,0.9)"; g.shadowBlur = 18; g.fillStyle = color;
  lines.forEach((part, i) => g.fillText(part, x, y + i * size * lineGap)); g.restore();
  return lines.length;
}
const rate = () => live.seconds > 0.4 ? Math.round(live.steps / live.seconds) : 19;
const CAPTION = {                                       // one or two short sentences per step, in everyday words
  title: () => "",
  crash: () => since("crash") < MERGE + 0.4 ? "Far out in space, two burnt-out stars circle each other. Closer and closer." : "They crash. The crash sends ripples through space, like a stone dropped in a pond.",
  machine: () => "On Earth, this machine listens for those ripples. A laser shoots light down two tunnels. Mirrors send it back.",
  ripple: () => "When a ripple passes, one tunnel gets a tiny bit longer and the other a tiny bit shorter. The light flickers. That flicker is what we measure.",
  design: () => `To hear fainter crashes, scientists plan bigger machines. This one has ${SCENE ? SCENE.variables : 193} settings to get right.`,
  search: () => "The computer finds good settings by trying. Change a little, test, keep what helps. Every test works out all the light in the machine.",
  compare: () => SCENE && SCENE.original ? `Our code runs ${rate()} tests every second. The original code needs ${SCENE.original.toFixed(0)} seconds for one test.` : `Our code runs ${rate()} tests every second.`,
  end: () => "",
};
const caption = { now: "", before: "", when: 0 };
function captions() {
  const text = CAPTION[STEPS[step]]();
  if (text !== caption.now && !(caption.now && text.replace(/\d+/g, "") === caption.now.replace(/\d+/g, ""))) { caption.before = caption.now; caption.when = time; }
  caption.now = text;                                    // a number that changes inside a sentence does not make it fade
  words(caption.before, 96, 952, 45, 1720, 1 - span(time - caption.when, 0, 0.35), 500);
  words(caption.now, 96, 952, 45, 1720, span(time - caption.when, 0.25, 0.85), 500);
}

// ---------------------------------------------------------------- step "crash": the two stars and the ripples
const MERGE = 8.3, RATE = 120, orbit = { angle: [], gap: [], height: [] };
(function integrate() {
  let angle = 0;
  for (let i = 0; i <= MERGE * RATE; i++) {
    const left = Math.max(1 - i / RATE / MERGE, 0), spin = Math.min(1.5 * Math.pow(Math.max(left, 0.004), -0.62), 7.5);
    angle += spin / RATE;
    orbit.angle.push(angle); orbit.gap.push(2.5 * Math.pow(left, 0.27)); orbit.height.push(0.3 + 0.75 * Math.pow(spin / 7.5, 0.8));
  }
})();
const pick = (list, t) => list[clamp(Math.round(t * RATE), 0, list.length - 1)];
const angleAt = t => t <= MERGE ? pick(orbit.angle, t) : orbit.angle[orbit.angle.length - 1] + 3.1 * (t - MERGE);   // after the crash the ripples keep spreading, more gently
const heightAt = t => t <= MERGE ? pick(orbit.height, t) : 0.3 + 0.75 * Math.exp(-(t - MERGE) / 1.1);
const CAMERA = { back: 12, height: 3.3, focal: 900, horizon: 318 };
function ripple(u, v, t) {                               // height of the fabric of space at (u, v): a two-armed spiral moving outwards
  const r = Math.hypot(u, v), then = t - r / 3.4;
  if (then <= 0) return 0;
  return heightAt(then) * Math.cos(2 * (Math.atan2(v, u) - angleAt(then))) / (1 + r * 0.16) * smooth(r / 2.6) * smooth(then / 0.6);
}
function project(u, v, z) { const d = v + CAMERA.back; return [W / 2 + u / d * CAMERA.focal, CAMERA.horizon + (CAMERA.height - z) / d * CAMERA.focal, d]; }
function drawFabric(t, alpha) {
  const floor = g.createLinearGradient(0, CAMERA.horizon - 30, 0, H); floor.addColorStop(0, "rgba(4,6,11,0)"); floor.addColorStop(0.22, `rgba(4,6,12,${0.86 * alpha})`); floor.addColorStop(1, `rgba(5,8,16,${0.94 * alpha})`);
  g.fillStyle = floor; g.fillRect(0, CAMERA.horizon - 30, W, H);
  g.lineWidth = 1.3; g.lineCap = "round"; g.lineJoin = "round";
  for (let v = -8.4; v <= 21; v += 0.7) {                // lines across: one depth each, so one opacity each
    const fade = Math.pow(clamp(1 - (v + 8.4) / 30), 1.5) * alpha;
    g.strokeStyle = rgba(RIPPLE, 0.07 * alpha + 0.62 * fade); g.beginPath();
    for (let i = 0; i <= 304; i++) { const u = -19 + i * 0.125, p = project(u, v, ripple(u, v, t)); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
    g.stroke();
  }
  for (let u = -18.9; u <= 19; u += 0.7) {               // lines into the distance fade with a gradient
    const near = project(u, -8.4, 0), far = project(u, 21, 0), paint = g.createLinearGradient(0, near[1], 0, far[1]);
    paint.addColorStop(0, rgba(RIPPLE, 0.6 * alpha)); paint.addColorStop(1, rgba(RIPPLE, 0.04 * alpha));
    g.strokeStyle = paint; g.beginPath();
    for (let i = 0; i <= 294; i++) { const v = -8.4 + i * 0.1, p = project(u, v, ripple(u, v, t)); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
    g.stroke();
  }
}
function glow(x, y, radius, color, alpha) {
  const paint = g.createRadialGradient(x, y, 0, x, y, radius);
  paint.addColorStop(0, rgba(color, alpha)); paint.addColorStop(0.25, rgba(color, alpha * 0.45)); paint.addColorStop(1, rgba(color, 0));
  g.fillStyle = paint; g.fillRect(x - radius, y - radius, radius * 2, radius * 2);
}
function drawStars(t, alpha) {
  g.globalCompositeOperation = "lighter";
  const lift = 1.25;
  if (t < MERGE) {
    for (const side of [0, Math.PI]) {
      for (let k = 46; k >= 0; k--) {                    // a fading trail behind each star
        const then = t - k * 0.012; if (then < 0) continue;
        const a = angleAt(then) + side, gap = pick(orbit.gap, then), p = project(gap * Math.cos(a), gap * Math.sin(a), lift);
        glow(p[0], p[1], 15 * 12 / p[2], [150, 190, 255], 0.05 * (1 - k / 46) * alpha);
      }
      const a = angleAt(t) + side, gap = pick(orbit.gap, t), p = project(gap * Math.cos(a), gap * Math.sin(a), lift), scale = 12 / p[2];
      glow(p[0], p[1], 120 * scale, [120, 170, 255], 0.5 * alpha); glow(p[0], p[1], 34 * scale, [235, 244, 255], alpha);
      g.fillStyle = rgba([255, 255, 255], alpha); g.beginPath(); g.arc(p[0], p[1], 7 * scale, 0, 6.2832); g.fill();
    }
  }
  const p = project(0, 0, lift), after = t - MERGE;
  if (after > 0) {                                       // the crash: a flash, a streak of light, then a glowing ember that stays
    const flash = Math.exp(-after / 0.42), ember = 0.3 + 0.7 * Math.exp(-after / 2.6);
    glow(p[0], p[1], 150 + 1250 * (1 - flash), [255, 244, 225], 0.85 * flash * alpha);
    glow(p[0], p[1], 240, [255, 190, 120], 0.8 * ember * alpha); glow(p[0], p[1], 46, [255, 255, 255], ember * alpha);
    g.fillStyle = rgba([255, 240, 215], 0.75 * flash * alpha);
    g.beginPath(); g.ellipse(p[0], p[1], 880 * Math.min(1, after * 4 + 0.1), 5 + 11 * flash, 0, 0, 6.2832); g.fill();
  }
  g.globalCompositeOperation = "source-over";
}

// ---------------------------------------------------------------- steps "machine" and "ripple": the detector
function beam(x1, y1, x2, y2, strength, scale = 1, alpha = 1) {   // a beam of laser light: wide soft halo, glow, hot core
  if (strength <= 0.004 || alpha <= 0.01) return;
  g.lineCap = "round";
  for (const [width, color, a] of [[(9 + 22 * strength) * scale, LASER, 0.07 + 0.16 * strength], [(3 + 6 * strength) * scale, LASER, 0.18 + 0.5 * strength], [(1 + 2.2 * strength) * scale, CORE, 0.25 + 0.75 * strength]]) {
    g.strokeStyle = rgba(color, a * alpha); g.lineWidth = width; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }
}
const CYCLE = 8;                                         // a ripple passes every eight seconds for as long as the step is shown
const chirp = x => {                                     // the stretch of the tunnels x seconds into a pass: slow, then faster and stronger, then gone
  if (x < 0.8 || x > 6.6) return 0;
  const k = clamp((x - 0.8) / 4.4), size = x < 5.2 ? 0.012 + 0.05 * Math.pow(k, 2.2) : 0.062 * Math.exp(-(x - 5.2) / 0.25);
  return size * smooth((x - 0.8) / 0.8) * Math.sin(6.2832 * (0.55 * (x - 0.8) + 0.36 * Math.pow(x - 0.8, 2.1)));
};
function drawMachine(alpha) {
  if (alpha <= 0.01) return;
  const rippling = step >= at_("ripple") && PART[STEPS[step]] === "machine", x = rippling ? since("ripple") % CYCLE : -1;
  const on = span(since("machine"), 0.2, 1.6);
  g.save(); g.globalAlpha = alpha;
  const ground = g.createRadialGradient(820, 520, 80, 820, 520, 1250); ground.addColorStop(0, "rgba(22,40,46,0.96)"); ground.addColorStop(1, "rgba(5,9,14,0.98)");
  g.fillStyle = ground; g.fillRect(0, 0, W, H);
  g.strokeStyle = "rgba(160,200,200,0.05)"; g.lineWidth = 1;                // faint survey lines on the ground
  for (let i = -6; i < 30; i++) { g.beginPath(); g.moveTo(i * 110, 0); g.lineTo(i * 110 + 600, H); g.stroke(); }
  const stretch = rippling ? chirp(x) : 0, cx = 560, cy = 610, across = 900 * (1 + stretch), up = 470 * (1 - stretch * 1.7);
  const strength = clamp(Math.abs(stretch) / 0.05), bands = rippling ? clamp(span(x, 0.6, 1.8) - span(x, 5.3, 6.4)) : 0;
  g.save(); g.translate(cx + 300, cy - 200); g.rotate(-0.62);               // the ripple itself, passing over the site
  for (let k = -9; k <= 9; k++) {
    const bx = k * 250 + ((time * 330) % 250), band = g.createLinearGradient(bx - 90, 0, bx + 90, 0);
    band.addColorStop(0, rgba(RIPPLE, 0)); band.addColorStop(0.5, rgba(RIPPLE, 0.12 * bands)); band.addColorStop(1, rgba(RIPPLE, 0));
    g.fillStyle = band; g.fillRect(bx - 90, -1500, 180, 3000);
  }
  g.restore();
  g.strokeStyle = "rgba(205,220,235,0.34)"; g.lineWidth = 2;                // the tunnels and the buildings
  for (const d of [-11, 11]) { g.beginPath(); g.moveTo(cx, cy + d); g.lineTo(cx + across, cy + d); g.moveTo(cx + d, cy); g.lineTo(cx + d, cy - up); g.stroke(); }
  g.fillStyle = "rgba(14,22,28,0.95)"; g.strokeStyle = "rgba(205,220,235,0.5)";
  for (const [bx, by, w, h] of [[cx - 58, cy - 58, 116, 116], [cx + across - 26, cy - 34, 74, 68], [cx - 34, cy - up - 48, 68, 74], [cx - 330, cy - 30, 96, 60], [cx - 36, cy + 150, 72, 62]]) { g.beginPath(); g.roundRect(bx, by, w, h, 8); g.fill(); g.stroke(); }
  g.globalCompositeOperation = "lighter";
  beam(cx - 234, cy, cx, cy, 0.95 * on); beam(cx, cy, cx + across + 8, cy, 0.9 * on); beam(cx, cy, cx, cy - up - 8, 0.9 * on);
  beam(cx, cy, cx, cy + 172, (0.05 + 0.95 * strength) * on);
  for (let k = 0; k < 4; k++) {                          // flashes of light running down each tunnel and back
    const there = ((time * 0.55 + k / 4) % 1), back = there < 0.5 ? there * 2 : 2 - there * 2;
    glow(cx + back * across, cy, 26, [255, 235, 215], 0.9 * on); glow(cx, cy - back * up, 26, [255, 235, 215], 0.9 * on);
  }
  glow(cx - 262, cy, 60, LASER, 0.8 * on); glow(cx, cy, 70, CORE, 0.5 * on);
  glow(cx, cy + 182, 30 + 90 * strength, [255, 236, 190], (0.2 + 0.8 * strength) * on);
  g.globalCompositeOperation = "source-over";
  g.strokeStyle = "rgba(236,242,250,0.95)"; g.lineWidth = 6; g.lineCap = "round";   // mirrors at the ends, the splitter in the corner
  g.beginPath(); g.moveTo(cx + across + 12, cy - 22); g.lineTo(cx + across + 12, cy + 22); g.moveTo(cx - 22, cy - up - 12); g.lineTo(cx + 22, cy - up - 12); g.stroke();
  g.lineWidth = 3; g.beginPath(); g.moveTo(cx - 20, cy + 20); g.lineTo(cx + 20, cy - 20); g.stroke();
  const label = (text, lx, ly, a, align = "left") => words(text, lx, ly, 27, 700, a * alpha, 500, SOFT, 1.25, align);
  label("laser", cx - 282, cy - 46, on, "center"); label("mirror", cx + across + 12, cy - 56, on, "center"); label("mirror", cx + 60, cy - up - 4, on);
  label("light sensor", cx + 56, cy + 192, on);
  label("each tunnel: 4 km long", cx + across / 2, cy + 56, span(since("machine"), 1.2, 2.2), "center");
  if (rippling) {                                        // what the sensor measures, drawn as it happens
    const x0 = 1000, x1 = 1800, y0 = 290, show = span(since("ripple"), 0.3, 1.2);
    g.globalAlpha = alpha * show; g.strokeStyle = "rgba(243,239,230,0.16)"; g.lineWidth = 1; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y0); g.stroke();
    g.strokeStyle = rgba([255, 236, 190], 0.95); g.lineWidth = 3; g.lineJoin = "round"; g.beginPath(); g.moveTo(x0, y0);
    for (let s = 0; s <= Math.min(x, 7); s += 0.008) g.lineTo(x0 + s / 7 * (x1 - x0), y0 - chirp(s) * 1900);
    g.stroke(); g.globalAlpha = alpha;
    label("what the light sensor measures", x0, y0 - 150, show);
    words("the stretch is drawn 50 billion billion times too big", x1, y0 + 168, 22, 900, show * alpha, 400, "rgba(243,239,230,0.5)", 1.2, "right");
  }
  g.restore();
}

// ---------------------------------------------------------------- steps "design" to "end": the bigger machine and the search
const strengthOf = power => clamp((power + 3) / 9.5);                        // from one thousandth of a watt to three million watts
function drawDesign(alpha) {
  if (!SCENE || alpha <= 0.01) return;
  const searching = step >= at_("search"), aside = searching ? span(since("search"), 0, 1.4) : 0, born = since("design");
  const f = { x: lerp(606, 96, aside), y: lerp(60, 104, aside), unit: lerp(177, 158, aside) }, u = f.unit / 177;
  const where = name => { const n = SCENE.nodes[name]; return [f.x + n.x * f.unit, f.y + n.y * f.unit]; };
  const middle = (SCENE.size + 1) / 2, arrive = name => { const n = SCENE.nodes[name], far = Math.hypot(n.x - middle, n.y - middle) * 0.75; return span(born, 0.4 + far, 1.2 + far); };
  const powers = searching && live.shown ? live.shown : SCENE.published_light;
  g.save(); g.globalCompositeOperation = "lighter";
  SCENE.beams.forEach((b, i) => { const p = where(b.a), q = where(b.b); beam(p[0], p[1], q[0], q[1], strengthOf(powers[i]), u, alpha * Math.min(arrive(b.a), arrive(b.b)) * span(born, 1.5, 3.3)); });
  g.restore();
  for (const [name, n] of Object.entries(SCENE.nodes)) {
    const [x, y] = where(name), a = alpha * arrive(name); if (a <= 0.01) continue;
    g.save(); g.globalAlpha = a; g.translate(x, y); g.lineCap = "round";
    if (n.kind === "mirror") { g.strokeStyle = "rgba(232,239,250,0.95)"; g.lineWidth = 5 * u; g.beginPath(); n.turn === "v" ? (g.moveTo(0, -17 * u), g.lineTo(0, 17 * u)) : (g.moveTo(-17 * u, 0), g.lineTo(17 * u, 0)); g.stroke(); }
    else if (n.kind === "splitter" || n.kind === "director") {
      g.fillStyle = "rgba(10,16,24,0.9)"; g.strokeStyle = "rgba(200,214,232,0.75)"; g.lineWidth = 1.6 * u; g.beginPath(); g.roundRect(-16 * u, -16 * u, 32 * u, 32 * u, 4 * u); g.fill(); g.stroke();
      g.strokeStyle = n.kind === "director" ? rgba([150, 226, 255], 0.95) : "rgba(232,239,250,0.95)"; g.lineWidth = 3 * u; g.beginPath(); g.moveTo(-10 * u, 10 * u); g.lineTo(10 * u, -10 * u); g.stroke();
    } else if (n.kind === "laser") {
      g.globalCompositeOperation = "lighter"; glow(0, 0, 44 * u, LASER, 0.75); g.globalCompositeOperation = "source-over";
      g.fillStyle = "#1a0f0c"; g.strokeStyle = rgba(CORE, 0.95); g.lineWidth = 2 * u; g.beginPath(); g.roundRect(-13 * u, -13 * u, 26 * u, 26 * u, 6 * u); g.fill(); g.stroke();
      g.fillStyle = rgba(CORE, 1); g.beginPath(); g.arc(0, 0, 4.5 * u, 0, 6.2832); g.fill();
    } else if (n.kind === "squeezer") {

function drawEnding() {

// ---------------------------------------------------------------- the live search
function startSearch() {
  if (live.started || !SCENE) return;
  Object.assign(live, { started: true, steps: 0, seconds: 0, best: [], shown: null, target: null, radius: 0, theirs: 0 });
  sources.forEach(source => source.reached = 0);
  live.stream = new EventSource("/run?seed=2");
  live.stream.onmessage = message => {
    const test = JSON.parse(message.data);
    live.steps = test.step + 1; live.seconds = test.seconds; live.target = test.light;
    live.best.push(Math.min(test.loss, live.best.length ? live.best[live.best.length - 1] : Infinity));
  };
  live.stream.onerror = stopSearch;
}
function stopSearch() { if (live.stream) live.stream.close(); live.stream = null; }

    if (!recorder) words("press the space bar to go on", W / 2, 968, 26, 900, title * (0.5 + 0.3 * Math.sin(time * 2.4)), 500, SOFT, 1.2, "center");
  }

let recorder = null, chunks = [];
