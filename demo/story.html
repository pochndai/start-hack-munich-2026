<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearing the universe, faster</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100vw; height: auto; display: block; background: #020308; cursor: pointer; }
  @media (min-aspect-ratio: 16/9) { canvas { width: auto; height: 100vh; } }
</style></head><body>
<canvas id="stage" width="1920" height="1080" role="img" aria-label="A demo in eight steps, advanced with the space bar: two stars crash and send ripples through space, a machine on Earth feels them with laser light, a bigger machine with 193 settings, and the live search for good settings by our code and by the original code."></canvas>
<script>
"use strict";
// How a frame is made:
//   1. the graphics chip paints the sky (stars, dust, or the ground under the machine) into a high-range image;
//   2. tens of thousands of points of light are added on top (the fabric of space, the two stars, the flash);
//   3. the diagrams (machine, grid, circles) are drawn on a hidden 2D canvas and laid over it, their bright parts made brighter than white;
//   4. everything bright spills light around it (bloom), then the image is mapped to the screen like film, with a little grain;
//   5. the words are drawn last, sharp, on the visible canvas. A recording of that canvas is the whole demo.
// The presenter drives it: every press of the space bar goes one step further, and each step keeps moving until the next press.
const stage = document.getElementById("stage"), ui = stage.getContext("2d"), W = 1920, H = 1080;
const content = document.createElement("canvas"); content.width = W; content.height = H;
const g = content.getContext("2d");
const INK = "#f5f2ea", SOFT = "rgba(245,242,234,0.6)", FAINT = "rgba(245,242,234,0.38)";
const LASER = [255, 70, 30], CORE = [255, 196, 150], RIPPLE = [120, 175, 255], OURS = [88, 232, 160], THEIRS = [255, 112, 92], GOLD = [255, 226, 170];

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const span = (t, a, b) => smooth((t - a) / (b - a));                              // 0 before a, 1 after b
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function random(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let k = Math.imul(seed ^ seed >>> 15, 1 | seed); k = k + Math.imul(k ^ k >>> 7, 61 | k) ^ k; return ((k ^ k >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- the steps
const STEPS = ["title", "crash", "machine", "ripple", "design", "search", "compare", "end"];
const PART = { title: "sky", crash: "crash", machine: "machine", ripple: "machine", design: "design", search: "design", compare: "design", end: "design" };
const LABEL = ["", "01   The crash", "02   The machine", "03   The signal", "04   A bigger machine", "05   The search", "06   The difference", ""];
const AUTO = [2.5, 14, 8, 10, 9, 11, 10, 7];                                     // seconds per step when recording
let SCENE = null, time = 0, lastFrame = 0, step = 0, previous = 0, changed = -10;
const entered = STEPS.map(() => -100), at_ = name => STEPS.indexOf(name), since = name => time - entered[at_(name)];
const live = { stream: null, steps: 0, seconds: 0, best: [], shown: null, target: null, started: false, radius: 0, theirs: 0 };
function go(to) {
  to = clamp(to, 0, STEPS.length - 1); if (to === step) return;
  previous = step; step = to; changed = time; entered[to] = time;
  if (to >= at_("search")) startSearch(); else { stopSearch(); live.started = false; }
}
function shows(part) {                                                            // how visible a part of the demo is right now, with a soft change between parts
  const now = PART[STEPS[step]], before = PART[STEPS[previous]], k = span(time - changed, 0, 0.9);
  return now === before ? +(now === part) : now === part ? k : before === part ? 1 - k : 0;
}

// ---------------------------------------------------------------- words (drawn last, on the visible canvas, so they stay sharp)
const later = []; let voice = 1;                          // how loudly the words of the scene being drawn are shown
function words(text, x, y, size, width, alpha, weight = 500, color = INK, lineGap = 1.25, align = "left", spacing = 0, accent = null) {
  alpha *= voice; if (alpha <= 0.01 || !text) return;
  later.push(() => {
    ui.font = `${weight} ${size}px ${SANS}`; ui.textBaseline = "alphabetic"; ui.letterSpacing = spacing + "px";
    const lines = [[]]; let wide = 0; const gap = ui.measureText(" ").width;
    for (const raw of text.split(" ")) {                 // a word between stars, *like this*, is drawn in the accent colour
      const marked = raw.startsWith("*"), word = raw.replace(/\*/g, ""), w = ui.measureText(word).width;
      if (wide + w > width && lines[lines.length - 1].length) { lines.push([]); wide = 0; }
      lines[lines.length - 1].push([word, w, marked]); wide += w + gap;
    }
    ui.save(); ui.globalAlpha = alpha; ui.shadowColor = "rgba(0,0,0,0.75)"; ui.shadowBlur = size * 0.5; ui.textAlign = "left";
    lines.forEach((line, i) => {
      const total = line.reduce((sum, part) => sum + part[1], 0) + gap * (line.length - 1);
      let cx = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
      for (const [word, w, marked] of line) { ui.fillStyle = marked && accent ? accent : color; ui.fillText(word, cx, y + i * size * lineGap); cx += w + gap; }
    });
    ui.restore(); ui.letterSpacing = "0px";
  });
}
function number(text, x, y, size, color, alpha, align = "left") {
  alpha *= voice; if (alpha <= 0.01) return;
  later.push(() => { ui.save(); ui.globalAlpha = alpha; ui.font = `600 ${size}px ${MONO}`; ui.textAlign = align; ui.fillStyle = color; ui.shadowColor = color; ui.shadowBlur = size * 0.35; ui.fillText(text, x, y); ui.restore(); });
}
const rate = () => live.seconds > 0.4 ? Math.round(live.steps / live.seconds) : 19;
const CAPTION = {                                       // one or two short sentences per step, in everyday words
  title: () => "",
  crash: () => since("crash") < MERGE + 0.4 ? "Far out in space, two burnt-out stars circle each other. *Closer* *and* *closer.*" : "They crash. The crash sends *ripples* *through* *space,* like a stone dropped in a pond.",
  machine: () => "On Earth, this machine listens for those ripples. A *laser* shoots light down two tunnels. Mirrors send it back.",
  ripple: () => "When a ripple passes, one tunnel gets a tiny bit longer and the other a tiny bit shorter. The light *flickers.* That flicker is what we measure.",
  design: () => `To hear fainter crashes, scientists plan bigger machines. This one has *${SCENE ? SCENE.variables : 193}* *settings* to get right.`,
  search: () => "The computer finds good settings by trying. Change a little, test, keep what helps. Every test works out *all* *the* *light* in the machine.",
  compare: () => SCENE && SCENE.original ? `Our code runs *${rate()}* *tests* *every* *second.* The original code needs ${SCENE.original.toFixed(0)} seconds for one test.` : `Our code runs *${rate()}* *tests* *every* *second.*`,
  end: () => "",
};
const ACCENT = { crash: rgba([150, 195, 255], 1), machine: rgba([255, 150, 110], 1), ripple: rgba(GOLD, 1), design: rgba(OURS, 1), search: rgba(GOLD, 1), compare: rgba(OURS, 1) };
const caption = { now: "", before: "", when: 0, accent: null, accentBefore: null };
function captions() {
  const text = CAPTION[STEPS[step]]();
  if (text !== caption.now && !(caption.now && text.replace(/\d+/g, "") === caption.now.replace(/\d+/g, ""))) { caption.before = caption.now; caption.accentBefore = caption.accent; caption.when = time; }
  caption.now = text; caption.accent = ACCENT[STEPS[step]];   // a number that changes inside a sentence does not make it fade
  const out = 1 - span(time - caption.when, 0, 0.35), into = span(time - caption.when, 0.25, 0.9), rise = (1 - into) * 14;
  words(caption.before, 96, 962, 46, 1700, out, 500, INK, 1.26, "left", -0.4, caption.accentBefore);
  words(caption.now, 96, 962 + rise, 46, 1700, into, 500, INK, 1.26, "left", -0.4, caption.accent);
  if (LABEL[step]) words(LABEL[step].toUpperCase(), 98, 902, 19, 900, 0.9 * span(time - changed, 0.2, 0.9), 600, FAINT, 1.2, "left", 3.2);
}

// ---------------------------------------------------------------- the graphics chip: sky, points of light, bloom, film
const glCanvas = document.createElement("canvas"); glCanvas.width = W; glCanvas.height = H;
const gl = glCanvas.getContext("webgl2", { antialias: false, alpha: false, powerPreference: "high-performance" });
const FLOAT = gl && gl.getExtension("EXT_color_buffer_float");
const QUAD = `#version 300 es
in vec2 p; out vec2 uv; void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
const HEAD = `#version 300 es
precision highp float; in vec2 uv; out vec4 o;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 6; i++) { v += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; } return v; }
`;
const SKY = HEAD + `
uniform float uTime, uDim, uGround, uWave, uWaveTime; uniform vec2 uSource;
vec3 stars(vec2 p, float scale, float seed) {            // one layer of stars: each cell of a grid may hold one, with its own size, colour and twinkle
  p *= scale; vec2 cell = floor(p), f = fract(p) - 0.5; vec3 sum = vec3(0.0);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 c = cell + vec2(x, y); float h = hash(c + seed);
    if (h < 0.72) continue;
    vec2 at = vec2(hash(c + seed + 7.1), hash(c + seed + 3.7)) - 0.5;
    float big = pow(hash(c + seed + 11.0), 9.0), d = length(f - vec2(x, y) - at * 0.8);
    float twinkle = 0.75 + 0.25 * sin(uTime * (1.0 + 4.0 * hash(c + 1.3)) + 40.0 * h);
    vec3 tint = mix(vec3(0.72, 0.82, 1.0), vec3(1.0, 0.82, 0.62), pow(hash(c + 5.5), 2.5));
    sum += tint * (0.24 + 10.0 * big) * twinkle * exp(-d * d * (6200.0 - 3800.0 * big));
  }
  return sum;
}
void main() {
  vec2 p = (uv - 0.5) * vec2(16.0 / 9.0, 1.0);
  vec2 from = p - (uSource - 0.5) * vec2(16.0 / 9.0, 1.0); float far = length(from);
  // a passing ripple really bends the picture of the stars behind it
  float bend = uWave * sin(far * 24.0 - uWaveTime * 5.0) * exp(-far * 1.4) * smoothstep(0.02, 0.2, far);
  p += normalize(from + 1e-5) * bend * 0.012;
  vec2 q = p + vec2(uTime * 0.004, 0.0);
  float dust = fbm(q * 1.7 + fbm(q * 3.1) * 0.9), band = exp(-pow((q.y + q.x * 0.28 + 0.06) * 2.2, 2.0));
  vec3 sky = vec3(0.004, 0.006, 0.014);
  sky += vec3(0.022, 0.034, 0.1) * pow(dust, 2.8) * (0.35 + 2.0 * band);
  sky += vec3(0.085, 0.028, 0.07) * pow(fbm(q * 2.6 + 9.0), 4.0) * band * 1.6;
  sky += vec3(0.008, 0.045, 0.05) * pow(fbm(q * 1.2 - 4.0), 5.0) * 2.0;
  sky += (stars(q, 26.0, 1.0) + stars(q * 1.3 + 3.0, 52.0, 9.0) * 0.6 + stars(q + 8.0, 110.0, 21.0) * 0.35) * (0.55 + 0.9 * band);
  sky *= uDim;
  // the ground under the machine: dark, with faint height lines like a map, lit where the machine stands
  vec2 m = p * 2.4 + vec2(3.0, 1.0); float hgt = fbm(m), line = smoothstep(0.0, 0.03, abs(fract(hgt * 15.0) - 0.5) - 0.45);
  vec3 ground = vec3(0.0035, 0.006, 0.008) + vec3(0.004, 0.012, 0.014) * exp(-dot(p + vec2(0.2, -0.04), p + vec2(0.2, -0.04)) * 2.2);
  ground += vec3(0.01, 0.034, 0.038) * line * (0.3 + 0.7 * exp(-dot(p, p) * 1.5));
  o = vec4(mix(sky, ground, uGround), 1.0);
}`;
const POINTS_VS = `#version 300 es
in vec2 corner; in vec3 where; in vec3 tint; uniform vec2 uSize; out vec2 c; out vec3 col;
void main() { c = corner; col = tint; vec2 px = where.xy + corner * where.z; gl_Position = vec4(px / uSize * 2.0 - 1.0, 0.0, 1.0); gl_Position.y = -gl_Position.y; }`;
const POINTS_FS = `#version 300 es
precision highp float; in vec2 c; in vec3 col; out vec4 o;
void main() { float d = dot(c, c); if (d > 1.0) discard; float soft = exp(-d * 4.5) - 0.011; o = vec4(col * max(soft, 0.0), 1.0); }`;
const OVER = HEAD + `
uniform sampler2D uContent; uniform float uGlow;
void main() {                                            // lay the diagrams over the sky; what is bright in them becomes brighter than white
  vec4 c = texture(uContent, uv); vec3 lin = pow(c.rgb, vec3(2.2)); float peak = max(lin.r, max(lin.g, lin.b));
  o = vec4(lin * (1.0 + uGlow * smoothstep(0.22, 0.95, peak)), c.a);
}`;
const BRIGHT = HEAD + `
uniform sampler2D uImage;
void main() { vec3 c = texture(uImage, uv).rgb; float peak = max(c.r, max(c.g, c.b)), knee = 0.5, soft = clamp(peak - 1.0 + knee, 0.0, 2.0 * knee);
  soft = soft * soft / (4.0 * knee + 1e-4); o = vec4(c * max(soft, peak - 1.0) / max(peak, 1e-4), 1.0); }`;
const DOWN = HEAD + `
uniform sampler2D uImage; uniform vec2 uTexel;
void main() { vec3 c = texture(uImage, uv).rgb * 4.0;
  c += texture(uImage, uv + uTexel * vec2(-1, -1)).rgb + texture(uImage, uv + uTexel * vec2(1, -1)).rgb + texture(uImage, uv + uTexel * vec2(-1, 1)).rgb + texture(uImage, uv + uTexel * vec2(1, 1)).rgb;
  o = vec4(c / 8.0, 1.0); }`;
const UP = HEAD + `
uniform sampler2D uImage; uniform vec2 uTexel;
void main() { vec3 c = texture(uImage, uv + uTexel * vec2(-2, 0)).rgb + texture(uImage, uv + uTexel * vec2(2, 0)).rgb + texture(uImage, uv + uTexel * vec2(0, -2)).rgb + texture(uImage, uv + uTexel * vec2(0, 2)).rgb;
  c += 2.0 * (texture(uImage, uv + uTexel * vec2(-1, 1)).rgb + texture(uImage, uv + uTexel * vec2(1, 1)).rgb + texture(uImage, uv + uTexel * vec2(-1, -1)).rgb + texture(uImage, uv + uTexel * vec2(1, -1)).rgb);
  o = vec4(c / 12.0, 1.0); }`;
const FILM = HEAD + `
uniform sampler2D uImage, uBloom; uniform float uTime, uStrength;
vec3 aces(vec3 x) { return clamp(x * (2.51 * x + 0.03) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
void main() {
  vec2 d = uv - 0.5; float edge = dot(d, d);
  vec3 c;                                                // the colours part a hair towards the corners, as in a real lens
  c.r = texture(uImage, 0.5 + d * (1.0 + 0.0022 * edge * 4.0)).r; c.g = texture(uImage, uv).g; c.b = texture(uImage, 0.5 + d * (1.0 - 0.0022 * edge * 4.0)).b;
  c += texture(uBloom, uv).rgb * uStrength;
  c *= 1.0 - 1.15 * pow(edge, 1.25);
  c = pow(aces(c * 1.05), vec3(1.0 / 2.2));
  c += (hash(uv * vec2(1920.0, 1080.0) + fract(uTime) * 91.7) - 0.5) * 0.034;
  o = vec4(c, 1.0);
}`;
function program(vs, fs) {

  const p = gl.createProgram(); gl.attachShader(p, make(gl.VERTEX_SHADER, vs)); gl.attachShader(p, make(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const where = {}; for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const name = gl.getActiveUniform(p, i).name; where[name] = gl.getUniformLocation(p, name); }
  return { p, where };
}
function target(w, h) {
  const texture = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  const frame = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, frame); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  return { texture, frame, w, h };
}
const POINT_LIMIT = 70000, points = new Float32Array(POINT_LIMIT * 6); let pointCount = 0;
function point(x, y, size, r, gr, b) { if (pointCount >= POINT_LIMIT) return; const i = pointCount++ * 6; points[i] = x; points[i + 1] = y; points[i + 2] = size; points[i + 3] = r; points[i + 4] = gr; points[i + 5] = b; }
let R = null;                                             // everything the graphics chip needs, made once
function setUp() {
  if (!gl || !FLOAT) return;                              // without it the diagrams are simply shown on a dark background
  R = { sky: program(QUAD, SKY), points: program(POINTS_VS, POINTS_FS), over: program(QUAD, OVER), bright: program(QUAD, BRIGHT), down: program(QUAD, DOWN), up: program(QUAD, UP), film: program(QUAD, FILM) };
  R.scene = target(W, H); R.levels = []; for (let i = 1; i <= 6; i++) R.levels.push(target(W >> i, H >> i));
  R.quad = gl.createVertexArray(); gl.bindVertexArray(R.quad);
  const corners = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, corners); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  for (const p of [R.sky, R.over, R.bright, R.down, R.up, R.film]) gl.bindAttribLocation(p.p, 0, "p");
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  R.cloud = gl.createVertexArray(); gl.bindVertexArray(R.cloud);
  const a = name => gl.getAttribLocation(R.points.p, name);
  gl.bindBuffer(gl.ARRAY_BUFFER, corners); gl.enableVertexAttribArray(a("corner")); gl.vertexAttribPointer(a("corner"), 2, gl.FLOAT, false, 0, 0);
  R.cloudData = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, R.cloudData); gl.bufferData(gl.ARRAY_BUFFER, points.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(a("where")); gl.vertexAttribPointer(a("where"), 3, gl.FLOAT, false, 24, 0); gl.vertexAttribDivisor(a("where"), 1);
  gl.enableVertexAttribArray(a("tint")); gl.vertexAttribPointer(a("tint"), 3, gl.FLOAT, false, 24, 12); gl.vertexAttribDivisor(a("tint"), 1);
  R.content = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, R.content);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  gl.bindVertexArray(null);
}
function pass(prog, into, set) {                          // draw one full-screen step into an image (or onto the hidden canvas)
  gl.bindFramebuffer(gl.FRAMEBUFFER, into ? into.frame : null); gl.viewport(0, 0, into ? into.w : W, into ? into.h : H);
  gl.useProgram(prog.p); set(prog.where); gl.bindVertexArray(R.quad); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
const use = (unit, texture, where) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, texture); gl.uniform1i(where, unit); };
function render(look) {
  gl.disable(gl.BLEND);
  pass(R.sky, R.scene, u => { gl.uniform1f(u.uTime, time); gl.uniform1f(u.uDim, look.dim); gl.uniform1f(u.uGround, look.ground); gl.uniform1f(u.uWave, look.wave); gl.uniform1f(u.uWaveTime, look.waveTime); gl.uniform2f(u.uSource, look.source[0] / W, 1 - look.source[1] / H); });
  gl.enable(gl.BLEND);
  if (pointCount) {                                       // points of light add up
    gl.blendFunc(gl.ONE, gl.ONE); gl.useProgram(R.points.p); gl.uniform2f(R.points.where.uSize, W, H);
    gl.bindVertexArray(R.cloud); gl.bindBuffer(gl.ARRAY_BUFFER, R.cloudData); gl.bufferSubData(gl.ARRAY_BUFFER, 0, points.subarray(0, pointCount * 6));
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, pointCount);
  }
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.content);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, content);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);           // the diagrams cover what is behind them
  pass(R.over, R.scene, u => { use(0, R.content, u.uContent); gl.uniform1f(u.uGlow, look.glow); });
  gl.disable(gl.BLEND);
  pass(R.bright, R.levels[0], u => use(0, R.scene.texture, u.uImage));
  for (let i = 1; i < R.levels.length; i++) pass(R.down, R.levels[i], u => { use(0, R.levels[i - 1].texture, u.uImage); gl.uniform2f(u.uTexel, 1 / R.levels[i - 1].w, 1 / R.levels[i - 1].h); });
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);       // each smaller, blurrier image is added back into the one above it
  for (let i = R.levels.length - 2; i >= 0; i--) pass(R.up, R.levels[i], u => { use(0, R.levels[i + 1].texture, u.uImage); gl.uniform2f(u.uTexel, 0.5 / R.levels[i + 1].w, 0.5 / R.levels[i + 1].h); });
  gl.disable(gl.BLEND);
  pass(R.film, null, u => { use(0, R.scene.texture, u.uImage); use(1, R.levels[0].texture, u.uBloom); gl.uniform1f(u.uTime, time); gl.uniform1f(u.uStrength, look.bloom); });
}

// ---------------------------------------------------------------- step "crash": the two stars and the fabric of space, as points of light
const MERGE = 8.3, RATE = 120, orbit = { angle: [], gap: [], height: [] };

  later.push(() => { ui.save(); ui.globalAlpha = a; ui.strokeStyle = INK; ui.lineWidth = 5; ui.lineCap = "round"; ui.lineJoin = "round"; ui.beginPath(); ui.moveTo(W / 2 - 62, 538); ui.lineTo(W / 2 + 62, 538); ui.moveTo(W / 2 + 30, 506); ui.lineTo(W / 2 + 62, 538); ui.lineTo(W / 2 + 30, 570); ui.stroke(); ui.restore(); });
  words("Same answers. *Fifty* *times* *faster.*", W / 2, 712, 60, 1600, a * span(since("end"), 1.0, 2.0), 600, INK, 1.2, "center", -1, rgba(OURS, 1));
  words("THE OFFICIAL TEST, ON ONE PROCESSOR CORE, BOTH ON THE SAME COMPUTER", W / 2, 776, 17, 1700, a * span(since("end"), 1.6, 2.6), 600, FAINT, 1.2, "center", 3);
}

// ---------------------------------------------------------------- the live search
function startSearch() {
  if (live.started || !SCENE) return;
  Object.assign(live, { started: true, steps: 0, seconds: 0, best: [], shown: null, target: null, radius: 0, theirs: 0 });
  sources.forEach(source => source.reached = 0);
  live.stream = new EventSource("/run?seed=2");
  live.stream.onmessage = message => {
    const test = JSON.parse(message.data);
    live.steps = test.step + 1; live.seconds = test.seconds; live.target = test.light;
    live.best.push(Math.min(test.loss, live.best.length ? live.best[live.best.length - 1] : Infinity));
  };
  live.stream.onerror = stopSearch;
}
function stopSearch() { if (live.stream) live.stream.close(); live.stream = null; }

// ---------------------------------------------------------------- putting it together
let recorder = null, chunks = [];
function draw() {
  later.length = 0; pointCount = 0;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = "source-over"; g.clearRect(0, 0, W, H);
  const crash = shows("crash"), machine = shows("machine"), design = shows("design");
  const look = { dim: 1 - 0.55 * design, ground: machine, wave: 0, waveTime: 0, source: [W / 2, 480], glow: 4, bloom: 0.17 };
  if (crash > 0.01) {
    const t = since("crash"); look.source = drawCrash(t, crash * span(t, 0, 1.6));
    look.wave = crash * (t < MERGE ? 0.35 + 0.65 * t / MERGE : 0.5 + 1.3 * Math.exp(-(t - MERGE) / 2.5)); look.waveTime = t;
  }
  drawMachine(machine);
  voice = step === at_("end") ? 1 - span(since("end"), 0, 0.8) : 1;
  if (design > 0.01) drawDesign(design);
  if (step >= at_("search")) drawReach(design * span(since("search"), 0.6, 1.8));
  voice = 1;
  drawEnding();
  captions();
  const title = shows("sky");                            // the opening card
  if (title > 0.01) {
    words("FEYER FASTER PHYSICS CHALLENGE   ·   START HACK MUNICH 2026", W / 2, 404, 19, 1700, title, 600, SOFT, 1.2, "center", 5);
    words("Hearing the universe, *faster*", W / 2, 520, 116, 1800, title, 600, INK, 1.1, "center", -3.5, rgba(OURS, 1));
    if (!recorder) words("PRESS THE SPACE BAR", W / 2, 972, 16, 900, title * (0.45 + 0.35 * Math.sin(time * 2.4)), 600, SOFT, 1.2, "center", 5);
  }
  ui.setTransform(1, 0, 0, 1, 0, 0); ui.globalAlpha = 1;
  if (R) { render(look); ui.drawImage(glCanvas, 0, 0); }
  else { ui.fillStyle = "#04060b"; ui.fillRect(0, 0, W, H); ui.drawImage(content, 0, 0); }
  for (const paint of later) paint();
  if (!recorder && step > 0) for (let i = 1; i < STEPS.length; i++) {      // where we are: one short line per step
    ui.fillStyle = i === step ? "rgba(245,242,234,0.95)" : i < step ? "rgba(245,242,234,0.42)" : "rgba(245,242,234,0.15)";
    ui.beginPath(); ui.roundRect(W - 96 - (STEPS.length - i) * 30, 1036, 22, 3, 2); ui.fill();
  }
}
function tick(now) {
  time += Math.min((now - lastFrame) / 1000, 0.1); lastFrame = now;
  if (live.target) live.shown = live.shown ? live.shown.map((v, i) => lerp(v, live.target[i], 0.22)) : live.target.slice();
  if (recorder && time - changed > AUTO[step]) { if (step < STEPS.length - 1) go(step + 1); else finishRecording(); }
  draw();
  requestAnimationFrame(tick);
}
function record() {                                       // plays every step for a fixed time and saves the result as a video
  if (recorder) return;
  go(0); changed = time; chunks = [];
  // H.264 where the browser offers it: it is encoded by the graphics chip and leaves the processor to the simulator
  const kind = ["video/mp4;codecs=avc1.640033", "video/webm;codecs=h264", "video/webm;codecs=vp9"].find(type => MediaRecorder.isTypeSupported(type));
  recorder = new MediaRecorder(stage.captureStream(30), { mimeType: kind, videoBitsPerSecond: 22000000 });
  recorder.ondataavailable = event => event.data.size && chunks.push(event.data);
  recorder.onstop = () => fetch("/recording", { method: "POST", headers: { "Content-Type": kind }, body: new Blob(chunks, { type: kind }) }).then(reply => reply.json()).then(reply => document.title = "Saved: " + reply.saved);
  recorder.start(1000); document.title = "Recording…";
}
function finishRecording() { const done = recorder; recorder = null; stopSearch(); setTimeout(() => done.stop(), 400); }
addEventListener("keydown", event => {
  if (recorder) return;
  if (event.code === "Space" || event.key === "ArrowRight" || event.key === "Enter" || event.key === "PageDown") { event.preventDefault(); go(step === STEPS.length - 1 ? 0 : step + 1); }
  else if (event.key === "ArrowLeft" || event.key === "Backspace" || event.key === "PageUp") { event.preventDefault(); go(step - 1); }
  else if (event.key >= "1" && event.key <= "8") go(+event.key - 1);
  else if (event.key === "r" || event.key === "R") record();
});
stage.addEventListener("click", () => { if (!recorder) go(step === STEPS.length - 1 ? 0 : step + 1); });
try { setUp(); } catch (problem) { console.error("The graphics chip refused a shader; showing the plain version.", problem); R = null; }
fetch("/scene.json").then(reply => reply.json()).then(scene => { SCENE = scene; });
requestAnimationFrame(now => { lastFrame = now; tick(now); });
</script></body></html>
